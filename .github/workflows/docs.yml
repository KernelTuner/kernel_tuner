name: Build documentation

on:
    push:
        branches: [master]

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

permissions:
    contents: write # needed to push the built documentation to the gh-pages branch

jobs:
    # This workflow contains a single job called "build"
    build:
        # The type of runner that the job will run on
        runs-on: ubuntu-latest
        steps:
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0 # also fetches the gh-pages branch
            - name: Install dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install pandoc
                  pip install -e .
                  pip install -r doc/requirements.txt
            - name: Build documentation
              run: sphinx-build -b html doc/source "$RUNNER_TEMP/html"
            - name: Commit documentation to gh-pages
              env:
                  TARGET_PATH: latest
              run: |
                  git config --global user.name "GitHub Action"
                  git config --global user.email "action@github.com"
                  git worktree add -B gh-pages "$RUNNER_TEMP/gh-pages" origin/gh-pages
                  cd "$RUNNER_TEMP/gh-pages"
                  rm -rf "$TARGET_PATH"
                  mkdir -p "$TARGET_PATH"
                  cp -r "$RUNNER_TEMP/html/." "$TARGET_PATH"
                  rm -rf "$TARGET_PATH/.doctrees"
                  touch "$TARGET_PATH/.nojekyll"
                  git add -A "$TARGET_PATH"
                  git commit --allow-empty -m "Add changes for $GITHUB_SHA"
            - name: Push changes
              run: git -C "$RUNNER_TEMP/gh-pages" push origin gh-pages
